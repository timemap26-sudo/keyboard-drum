<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f6b"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2304f"/>
      <stop offset=".5" stop-color="#ff5c7a"/>
      <stop offset="1" stop-color="#c2304f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- sticks -->
  <g stroke-linecap="round">
    <line x1="120" y1="70" x2="250" y2="250" stroke="#ffd84d" stroke-width="22"/>
    <line x1="392" y1="70" x2="262" y2="250" stroke="#ffd84d" stroke-width="22"/>
    <circle cx="120" cy="70" r="20" fill="#ffe98a"/>
    <circle cx="392" cy="70" r="20" fill="#ffe98a"/>
  </g>
  <!-- drum shell -->
  <path d="M106 262 v120 a150 52 0 0 0 300 0 v-120 z" fill="url(#shell)"/>
  <!-- tension lugs -->
  <g stroke="#ffe0e6" stroke-width="10" stroke-linecap="round" opacity=".9">
    <line x1="146" y1="300" x2="146" y2="410"/>
    <line x1="206" y1="310" x2="206" y2="428"/>
    <line x1="306" y1="310" x2="306" y2="428"/>
    <line x1="366" y1="300" x2="366" y2="410"/>
  </g>
  <!-- rims -->
  <path d="M106 382 a150 52 0 0 0 300 0" fill="none" stroke="#6b4dff" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="256" cy="262" rx="150" ry="52" fill="#eceaf5" stroke="#6b4dff" stroke-width="14"/>
  <!-- hit sparkle -->
  <g fill="#ffd84d">
    <circle cx="256" cy="250" r="12"/>
    <circle cx="210" cy="232" r="6" opacity=".8"/>
    <circle cx="302" cy="232" r="6" opacity=".8"/>
  </g>
</svg>
