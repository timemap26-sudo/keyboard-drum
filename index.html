<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鍵盤打鼓</title>
<style>
  :root {
    --bg: #12121a;
    --panel: #1d1d2a;
    --text: #eceaf5;
    --muted: #8b89a0;
    --line: #ffffff22;
    --perfect: #ffd84d;
    --good: #5ee0a0;
    --miss: #ff5c7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #24203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  header { text-align: center; padding: 16px 16px 4px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 12px 16px; max-width: 900px;
  }
  button, select {
    background: var(--panel); color: var(--text);
    border: 1px solid #ffffff1f; border-radius: 10px;
    padding: 8px 14px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  button:hover, select:hover { border-color: #ffffff55; }
  .vol {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid #ffffff1f; border-radius: 10px;
    padding: 4px 12px; font-size: 15px;
  }
  .vol input { width: 110px; accent-color: #6b4dff; cursor: pointer; }
  .vol span { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  button.primary { background: #6b4dff; border-color: #6b4dff; }
  button.active { background: #6b4dff; border-color: #6b4dff; }

  .hud {
    display: flex; gap: 24px; justify-content: center; font-variant-numeric: tabular-nums;
    font-size: 16px; min-height: 24px; color: var(--muted);
  }
  .hud b { color: var(--text); font-size: 20px; }

  #stage {
    position: relative; width: min(900px, calc(100vw - 32px));
    margin: 8px 16px;
  }
  canvas {
    display: block; width: 100%; height: 360px;
    background: #0c0c13; border-radius: 14px; border: 1px solid #ffffff14;
  }
  #judge {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
    font-size: 40px; font-weight: 800; pointer-events: none; opacity: 0;
    text-shadow: 0 2px 12px #000;
  }
  #judge.show { animation: pop .45s ease-out; }
  @keyframes pop {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: #0c0c13dd; border-radius: 14px; text-align: center; padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 26px; }
  #overlay p { margin: 0; color: var(--muted); }
  .grade { font-size: 64px; font-weight: 900; color: var(--perfect); }

  .pads {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px;
    width: min(900px, calc(100vw - 32px)); margin: 8px 16px 24px;
  }
  .pad {
    aspect-ratio: 1 / 1.1; border-radius: 14px; border: 2px solid var(--c);
    background: color-mix(in srgb, var(--c) 14%, var(--panel));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .06s, background .1s; touch-action: manipulation;
  }
  .pad .key { font-size: 26px; font-weight: 800; }
  .pad .name { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .pad.hit { transform: scale(.93); background: var(--c); }
  .pad.wait { animation: waitPulse .6s ease-in-out infinite alternate; }
  @keyframes waitPulse {
    from { box-shadow: 0 0 0 0 var(--c); }
    to   { box-shadow: 0 0 18px 4px var(--c); transform: translateY(-3px); }
  }
  .pad.hit .name { color: #000a; }
  .pad.hit .key { color: #000; }

  footer { color: var(--muted); font-size: 13px; padding: 0 16px 24px; text-align: center; }

  @media (max-width: 600px) {
    .pads { grid-template-columns: repeat(4, 1fr); }
    canvas { height: 300px; }
    .pad .key { font-size: 20px; }
  }
</style>
</head>
<body>
<header>
  <h1>🥁 鍵盤打鼓</h1>
  <div class="sub">用鍵盤 A S D F J K L ; 打鼓，跟著節奏得高分！</div>
</header>

<div class="controls">
  <button id="modeFree" class="active">自由演奏</button>
  <button id="modeGame">節奏挑戰</button>
  <select id="song"></select>
  <select id="speed">
    <option value="0.4">超慢速 (40%)</option>
    <option value="0.55">很慢 (55%)</option>
    <option value="0.7">慢速 (70%)</option>
    <option value="0.85">稍慢 (85%)</option>
    <option value="1" selected>正常</option>
    <option value="1.25">快速</option>
  </select>
  <label class="vol" title="音量 (↑ / ↓ 調整)">🔊
    <input id="vol" type="range" min="0" max="100" step="1" value="100">
    <span id="volVal">100%</span>
  </label>
  <button id="waitBtn" title="音符停在白線，等你按對才繼續 (W)">⏸ 等我按：關</button>
  <button id="bassBtn" class="active" title="貝斯伴奏 (B)">🎸 伴奏：開</button>
  <button id="start" class="primary">開始 (空白鍵)</button>
</div>

<div class="hud">
  <span>分數 <b id="score">0</b></span>
  <span>連擊 <b id="combo">0</b></span>
  <span>準確率 <b id="acc">-</b></span>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="judge"></div>
  <div id="overlay" class="hidden"></div>
</div>

<div class="pads" id="pads"></div>

<footer>自由演奏：隨意敲擊。節奏挑戰：音符落到白線時按下對應按鍵。開啟「等我按」時音符會停在白線等你按對。按 Esc 停止，↑ / ↓ 調整音量，W 切換等我按，B 切換伴奏。</footer>

<script>
// ---------- Drum kit ----------
const DRUMS = [
  { key: 'a', label: 'A', name: '大鼓',   id: 'kick',  color: '#ff5c7a' },
  { key: 's', label: 'S', name: '小鼓',   id: 'snare', color: '#ffa94d' },
  { key: 'd', label: 'D', name: '閉合鈸', id: 'hhc',   color: '#ffd84d' },
  { key: 'f', label: 'F', name: '開放鈸', id: 'hho',   color: '#a6e35b' },
  { key: 'j', label: 'J', name: '高音鼓', id: 'tom1',  color: '#4dd9c4' },
  { key: 'k', label: 'K', name: '中音鼓', id: 'tom2',  color: '#4da6ff' },
  { key: 'l', label: 'L', name: '落地鼓', id: 'tom3',  color: '#8f7bff' },
  { key: ';', label: ';', name: '碎音鈸', id: 'crash', color: '#e07bff' },
];
const LANE_OF = Object.fromEntries(DRUMS.map((d, i) => [d.id, i]));

let ac = null, master = null, musicBus = null, noiseBuf = null;
let volume = 1;
const BOOST = 1.7; // overall loudness before the limiter
try { const v = localStorage.getItem('kd-volume'); if (v !== null) volume = Math.min(1, Math.max(0, +v)); } catch (e) {}
function setVolume(v) {
  volume = Math.min(1, Math.max(0, v));
  if (master) master.gain.setTargetAtTime(volGain(), ac.currentTime, 0.01);
  const pct = Math.round(volume * 100);
  volEl.value = pct; volValEl.textContent = pct + '%';
  try { localStorage.setItem('kd-volume', volume); } catch (e) {}
}
// gentle curve: quiet end stays usable, top end is loud
function volGain() { return BOOST * Math.pow(volume, 1.5); }
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = volGain();
  // compressor -> makeup gain -> soft clipper: louder without harsh clipping
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 8; comp.ratio.value = 6;
  comp.attack.value = 0.003; comp.release.value = 0.2;
  const makeup = ac.createGain(); makeup.gain.value = 1.9;
  const clip = ac.createWaveShaper();
  const curve = new Float32Array(2048);
  for (let i = 0; i < curve.length; i++) { const x = i / 1023.5 - 1; curve[i] = Math.tanh(1.5 * x) / Math.tanh(1.5); }
  clip.curve = curve; clip.oversample = '2x';
  master.connect(comp).connect(makeup).connect(clip).connect(ac.destination);
  musicBus = ac.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

function noise(t, dur, { type = 'highpass', freq = 7000, q = 1, gain = 0.5, attack = 0.001 } = {}) {
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(master);
  src.start(t); src.stop(t + dur + 0.05);
}
function tone(t, f0, f1, dur, gain, type = 'sine', out = master) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(out);
  o.start(t); o.stop(t + dur + 0.05);
}
function bassNote(t, midi, dur) {
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f;
  const o2 = ac.createOscillator(); o2.type = 'square'; o2.frequency.value = f / 2;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 6;
  lp.frequency.setValueAtTime(2200, t); lp.frequency.exponentialRampToValueAtTime(260, t + dur);
  const g = ac.createGain(), g2 = ac.createGain(); g2.gain.value = 0.5;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.55, t + 0.006);
  g.gain.setValueAtTime(0.55, t + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.08);
  o1.connect(lp); o2.connect(g2).connect(lp); lp.connect(g).connect(musicBus);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
}

const SOUNDS = {
  kick:  t => { tone(t, 170, 42, 0.5, 1.2); tone(t, 90, 40, 0.25, 0.6, 'triangle'); noise(t, 0.025, { type: 'lowpass', freq: 4000, gain: 0.5 }); },
  snare: t => { tone(t, 240, 130, 0.13, 0.7, 'triangle'); noise(t, 0.25, { type: 'highpass', freq: 1400, gain: 0.8 }); noise(t, 0.12, { type: 'bandpass', freq: 3200, q: 0.8, gain: 0.5 }); },
  hhc:   t => noise(t, 0.06, { type: 'highpass', freq: 7500, gain: 0.5 }),
  hho:   t => noise(t, 0.45, { type: 'highpass', freq: 6500, gain: 0.42 }),
  tom1:  t => { tone(t, 320, 180, 0.32, 0.9); noise(t, 0.03, { type: 'bandpass', freq: 2500, gain: 0.25 }); },
  tom2:  t => { tone(t, 210, 120, 0.38, 0.95); noise(t, 0.03, { type: 'bandpass', freq: 2000, gain: 0.25 }); },
  tom3:  t => { tone(t, 140, 75, 0.5, 1.05); noise(t, 0.03, { type: 'bandpass', freq: 1500, gain: 0.25 }); },
  crash: t => { noise(t, 1.5, { type: 'highpass', freq: 4500, gain: 0.5, attack: 0.003 }); noise(t, 0.9, { type: 'bandpass', freq: 9000, q: 0.6, gain: 0.3 }); },
};
function play(id, t) { initAudio(); SOUNDS[id](t ?? ac.currentTime); }

// ---------- Songs (patterns on a 16th-note grid) ----------
// pattern: drum id -> 16-step string ('x' = hit). May be an array of patterns that alternate per bar.
// fills: bar index -> overrides. bass: 16-step string, chars = semitones above the bar's chord root
// ('0'-'9','a','b', 'o' = octave up), prog = chord roots (semitones from root MIDI note) cycled per bar.
const SONGS = [
  {
    name: '入門搖滾 (90 BPM)', bpm: 90, bars: 8, root: 40, prog: [0, 0, 5, 7],
    pattern: {
      kick:  'x.......x.......',
      snare: '....x.......x...',
      hhc:   'x...x...x...x...',
    },
    bass: '0.......0...0...',
    fills: { 7: { tom1: '........x.x.....', tom2: '............x...', tom3: '..............x.', snare: '....x...........' } },
  },
  {
    name: '流行節拍 (100 BPM)', bpm: 100, bars: 8, root: 43, prog: [0, 7, 9, 5],
    pattern: {
      kick:  'x.....x...x.....',
      snare: '....x.......x...',
      hhc:   'x.x.x.x.x.x.x.x.',
    },
    bass: '0.....0...0.0...',
    fills: {
      3: { hho: '..............x.', hhc: 'x.x.x.x.x.x.x...' },
      7: { hhc: '................', snare: '....x...xxxx....', tom1: '............x...', tom2: '.............x..', tom3: '..............xx' },
    },
  },
  {
    name: '🔥 迪斯可派對 (118 BPM)', bpm: 118, bars: 12, root: 45, prog: [0, 0, 5, 7],
    pattern: {
      kick:  'x...x...x...x...',
      snare: '....x.......x...',
      hhc:   'x...x...x...x...',
      hho:   '..x...x...x...x.',
    },
    bass: '0.o.0.o.0.o.0.o.',
    fills: {
      3:  { snare: '....x.......x.xx' },
      7:  { hho: '..x...x.........', snare: '....x...x.x.xxxx' },
      11: { hho: '................', hhc: '................', snare: '....x...xxxx....', tom1: '............x...', tom2: '.............x..', tom3: '..............xx' },
    },
  },
  {
    name: '🔥 嘻哈 Boom Bap (88 BPM)', bpm: 88, bars: 12, root: 38, prog: [0, 0, 3, 5],
    pattern: [
      { kick: 'x.....x..x......', snare: '....x.......x...', hhc: 'x.x.x.x.x.x.x.x.' },
      { kick: 'x.x...x..x....x.', snare: '....x.......x...', hhc: 'x.x.x.x.x.x.xxx.' },
    ],
    bass: '0.....0..0....3.',
    fills: {
      5:  { hho: '..............x.' },
      11: { hhc: 'x.x.x.x.........', snare: '....x...x..x.x..', tom2: '..........x.....', tom3: '..............xx' },
    },
  },
  {
    name: '放克律動 (95 BPM)', bpm: 95, bars: 8, root: 40, prog: [0, 0, 5, 0],
    pattern: {
      kick:  'x..x..x...x..x..',
      snare: '....x.......x..x',
      hhc:   'xxxxxxxxxxxxxxxx',
    },
    bass: '0..0..o...0..357',
    fills: {
      3: { hhc: 'xxxxxxxxxxxxxx..', hho: '..............x.' },
      7: { hhc: 'xxxxxxxx........', tom1: '........xx......', tom2: '..........xx....', tom3: '............xx..' },
    },
  },
  {
    name: '🔥 拉丁森巴 (108 BPM)', bpm: 108, bars: 12, root: 41, prog: [0, 5, 7, 0],
    pattern: [
      { kick: 'x..xx..xx..xx..x', snare: '....x.......x...', hhc: 'x.x.x.x.x.x.x.x.', tom1: '..x.......x.....' },
      { kick: 'x..xx..xx..xx..x', snare: '....x.......x...', hhc: 'x.x.x.x.x.x.x.x.', tom2: '......x.....x.x.' },
    ],
    bass: '0..7o..70..7o..7',
    fills: {
      5:  { tom1: '..x...x...x.....', tom2: '.......x...x....' },
      11: { hhc: '................', kick: 'x...x...........', tom1: '..xx....x.......', tom2: '....xx....x.....', tom3: '......xx....xxxx' },
    },
  },
  {
    name: '狂飆金屬 (130 BPM)', bpm: 130, bars: 8, root: 40, prog: [0, 0, 1, 3],
    pattern: {
      kick:  'x.x.x.x.x.x.x.x.',
      snare: '....x.......x...',
      hho:   'x...x...x...x...',
    },
    bass: '0.0.0.0.0.0.0.0.',
    fills: {
      3: { snare: '....x.......x.xx' },
      7: { hho: '................', kick: 'x.x.x.x.........', snare: '....x...x.x.....', tom1: '............x...', tom2: '.............x..', tom3: '..............xx' },
    },
  },
  {
    name: '🔥 鼓打貝斯 D&B (160 BPM)', bpm: 160, bars: 12, root: 41, prog: [0, 0, 8, 10],
    pattern: [
      { kick: 'x.........x.....', snare: '....x.......x...', hhc: 'x.x.x.x.x.x.x.x.' },
      { kick: 'x.x.......x..x..', snare: '....x.......x...', hhc: 'x.x.x.x.x.x.x.x.' },
    ],
    bass: '0.......o.....0.',
    fills: {
      3:  { hho: '..............x.' },
      7:  { snare: '....x.......x.x.', hho: '..............x.' },
      11: { hhc: '................', snare: '....x...x.x.x...', tom1: '............x...', tom2: '.............x..', tom3: '..............x.' },
    },
  },
];
const BASS_STEP = { o: 12, a: 10, b: 11 };

function buildChart(song, speed) {
  const bpm = song.bpm * speed;
  const step = 60 / bpm / 4;
  const lead = Math.max(2.0, 4 * 60 / bpm + 0.3); // room for a 4-beat count-in
  const notes = [], music = [];
  for (let bar = 0; bar < song.bars; bar++) {
    const base = Array.isArray(song.pattern) ? song.pattern[bar % song.pattern.length] : song.pattern;
    const pat = Object.assign({}, base, song.fills?.[bar] || {});
    for (const [id, str] of Object.entries(pat)) {
      for (let i = 0; i < 16; i++) {
        if (str[i] === 'x') notes.push({ t: lead + (bar * 16 + i) * step, lane: LANE_OF[id], id });
      }
    }
    if (bar === 0) notes.push({ t: lead, lane: LANE_OF.crash, id: 'crash' });
    const chord = song.root + song.prog[bar % song.prog.length];
    for (let i = 0; i < 16; i++) {
      const c = song.bass[i];
      if (c === '.') continue;
      const off = BASS_STEP[c] ?? parseInt(c, 10);
      let len = 1; while (i + len < 16 && song.bass[i + len] === '.' && len < 3) len++;
      music.push({ t: lead + (bar * 16 + i) * step, midi: chord + off, dur: step * len * 0.9 });
    }
  }
  const tEnd = lead + song.bars * 16 * step;
  notes.push({ t: tEnd, lane: LANE_OF.crash, id: 'crash' }, { t: tEnd, lane: LANE_OF.kick, id: 'kick' });
  music.push({ t: tEnd, midi: song.root, dur: 60 / bpm * 2 });
  notes.sort((a, b) => a.t - b.t);
  return { notes, music, step, end: tEnd + 1.2, bpm, lead };
}

// ---------- UI ----------
const padsEl = document.getElementById('pads');
const padEls = DRUMS.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'pad'; el.style.setProperty('--c', d.color);
  el.innerHTML = `<div class="key">${d.label}</div><div class="name">${d.name}</div>`;
  el.addEventListener('pointerdown', e => { e.preventDefault(); hit(i); });
  padsEl.appendChild(el);
  return el;
});

const volEl = document.getElementById('vol'), volValEl = document.getElementById('volVal');
volEl.addEventListener('input', () => setVolume(volEl.value / 100));
setVolume(volume);

const songSel = document.getElementById('song');
SONGS.forEach((s, i) => songSel.add(new Option(s.name, i)));

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const judgeEl = $('judge'), overlay = $('overlay');

let mode = 'free';
let game = null;          // active rhythm session
const flashes = new Array(8).fill(0);  // lane flash timestamps
const particles = [];

function setMode(m) {
  stopGame();
  mode = m;
  $('modeFree').classList.toggle('active', m === 'free');
  $('modeGame').classList.toggle('active', m === 'game');
  songSel.disabled = $('speed').disabled = false;
  if (m === 'game') showOverlay('<h2>節奏挑戰</h2><p>選擇歌曲，按「開始」或空白鍵</p>');
  else hideOverlay();
  resetHud();
}
$('modeFree').onclick = () => setMode('free');
$('modeGame').onclick = () => setMode('game');
$('start').onclick = () => startGame();

let waitMode = false, bassOn = true;
try { waitMode = localStorage.getItem('kd-wait') === '1'; bassOn = localStorage.getItem('kd-bass') !== '0'; } catch (e) {}
function renderToggles() {
  $('waitBtn').textContent = '⏸ 等我按：' + (waitMode ? '開' : '關');
  $('waitBtn').classList.toggle('active', waitMode);
  $('bassBtn').textContent = '🎸 伴奏：' + (bassOn ? '開' : '關');
  $('bassBtn').classList.toggle('active', bassOn);
}
function toggleWait() {
  waitMode = !waitMode;
  if (game) game.wait = waitMode;
  try { localStorage.setItem('kd-wait', waitMode ? '1' : '0'); } catch (e) {}
  renderToggles();
}
function toggleBass() {
  bassOn = !bassOn;
  try { localStorage.setItem('kd-bass', bassOn ? '1' : '0'); } catch (e) {}
  renderToggles();
}
$('waitBtn').onclick = e => { e.currentTarget.blur(); toggleWait(); };
$('bassBtn').onclick = e => { e.currentTarget.blur(); toggleBass(); };
renderToggles();

function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove('hidden'); }
function hideOverlay() { overlay.classList.add('hidden'); }

function resetHud() { $('score').textContent = 0; $('combo').textContent = 0; $('acc').textContent = '-'; }

// ---------- Input ----------
const held = new Set();
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault(); setVolume(volume + (e.key === 'ArrowUp' ? 0.05 : -0.05)); return;
  }
  if (e.target.tagName === 'INPUT') e.target.blur();
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); if (!e.repeat) startGame(); return; }
  if (k === 'w' && !e.repeat) { toggleWait(); return; }
  if (k === 'b' && !e.repeat) { toggleBass(); return; }
  if (k === 'escape') { if (game) { stopGame(); showOverlay('<h2>已停止</h2><p>按空白鍵重新開始</p>'); } return; }
  const i = DRUMS.findIndex(d => d.key === k);
  if (i < 0 || e.repeat || held.has(k)) return;
  held.add(k);
  e.preventDefault();
  hit(i);
});
window.addEventListener('keyup', e => held.delete(e.key.toLowerCase()));

function hit(lane) {
  initAudio();
  play(DRUMS[lane].id);
  flashes[lane] = performance.now();
  const p = padEls[lane];
  p.classList.add('hit');
  clearTimeout(p._t); p._t = setTimeout(() => p.classList.remove('hit'), 90);
  if (game && game.running) judgeHit(lane);
  else burst(lane, DRUMS[lane].color, 8);
}

// ---------- Rhythm game ----------
const WIN_PERFECT = 0.05, WIN_GOOD = 0.11, WIN_MISS = 0.16;

function startGame() {
  initAudio();
  if (mode !== 'game') setMode('game');
  stopGame();
  const song = SONGS[+songSel.value];
  const chart = buildChart(song, +$('speed').value);
  game = {
    ...chart,
    notes: chart.notes.map(n => ({ ...n, state: 0 })), // 0 pending, 1 hit, 2 missed
    t0: ac.currentTime + 0.1,
    score: 0, combo: 0, maxCombo: 0, perfect: 0, good: 0, miss: 0, wrong: 0,
    running: true, wait: waitMode, waiting: false, ptr: 0, mptr: 0, usedWait: waitMode,
  };
  // count-in metronome clicks during lead-in (one bar of quarter notes before start)
  const beat = 60 / game.bpm;
  for (let b = 4; b >= 1; b--) {
    const t = game.t0 + game.lead - b * beat;
    if (t > ac.currentTime) tone(t, b === 4 ? 1500 : 1000, b === 4 ? 1500 : 1000, 0.05, 0.25, 'square');
  }
  hideOverlay(); resetHud();
  songSel.disabled = $('speed').disabled = true;
}

function stopGame() {
  if (game) game.running = false;
  padEls.forEach(p => p.classList.remove('wait'));
  game = null;
  songSel.disabled = $('speed').disabled = false;
}

// earliest note not yet hit/missed
function gateTime() {
  const n = game.notes;
  while (game.ptr < n.length && n[game.ptr].state) game.ptr++;
  return game.ptr < n.length ? n[game.ptr].t : Infinity;
}

// song clock; in wait mode it freezes at the first unhit note until it is played
function songTime() {
  let t = ac.currentTime - game.t0;
  game.waiting = false;
  if (game.wait) {
    const gate = gateTime();
    if (t > gate) { game.t0 += t - gate; t = gate; game.waiting = true; game.frozenGate = gate; }
  }
  return t;
}

function scheduleMusic(now) {
  const notes = game.music, limit = now + 0.15;
  const gate = game.wait ? gateTime() : Infinity;
  while (game.mptr < notes.length && notes[game.mptr].t <= limit && notes[game.mptr].t < gate) {
    const ev = notes[game.mptr++];
    if (!bassOn) continue;
    const at = game.t0 + ev.t;
    if (at > ac.currentTime - 0.05) bassNote(Math.max(at, ac.currentTime), ev.midi, ev.dur);
  }
}

function judgeHit(lane) {
  const now = songTime();
  if (game.wait) return judgeWait(lane, now);
  let best = null, bestDt = Infinity;
  for (const n of game.notes) {
    if (n.state || n.lane !== lane) continue;
    const dt = Math.abs(n.t - now);
    if (dt < bestDt) { bestDt = dt; best = n; }
    if (n.t - now > WIN_MISS) break;
  }
  if (!best || bestDt > WIN_MISS) { // stray hit, no penalty except small particle
    burst(lane, '#ffffff55', 4);
    return;
  }
  if (bestDt <= WIN_PERFECT) registerJudge(best, 'perfect');
  else if (bestDt <= WIN_GOOD) registerJudge(best, 'good');
  else registerJudge(best, 'miss');
}

function judgeWait(lane, now) {
  let note = null;
  for (let i = game.ptr; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.t > now + WIN_GOOD) break;
    if (!n.state && n.lane === lane) { note = n; break; }
  }
  if (!note) { // wrong key
    game.wrong++; game.combo = 0;
    showJudge('按錯了', 'miss'); updateHud();
    return;
  }
  const dt = Math.abs(note.t - now);
  // a note the clock had to stop for counts as 'good'; on-time hits are still 'perfect'
  registerJudge(note, dt <= WIN_PERFECT && game.frozenGate !== note.t ? 'perfect' : 'good');
}

function showJudge(text, kind) {
  judgeEl.textContent = text;
  judgeEl.style.color = `var(--${kind})`;
  judgeEl.classList.remove('show'); void judgeEl.offsetWidth; judgeEl.classList.add('show');
}

function registerJudge(note, kind) {
  const g = game;
  if (kind === 'miss') {
    note.state = 2; g.miss++; g.combo = 0;
  } else {
    note.state = 1; g.combo++; g.maxCombo = Math.max(g.maxCombo, g.combo);
    const base = kind === 'perfect' ? 300 : 100;
    g.score += Math.round(base * (1 + Math.min(g.combo, 100) / 50));
    g[kind]++;
    burst(note.lane, DRUMS[note.lane].color, kind === 'perfect' ? 16 : 9);
  }
  showJudge({ perfect: '完美!', good: '不錯', miss: '失誤' }[kind], kind);
  updateHud();
}

function updateHud() {
  const g = game;
  $('score').textContent = g.score;
  $('combo').textContent = g.combo;
  const judged = g.perfect + g.good + g.miss + g.wrong;
  $('acc').textContent = judged ? ((g.perfect + g.good * 0.5) / judged * 100).toFixed(1) + '%' : '-';
}

function finishGame() {
  const g = game;
  const total = g.notes.length;
  const acc = (g.perfect + g.good * 0.5) / (total + g.wrong) * 100;
  const grade = acc >= 95 ? 'S' : acc >= 85 ? 'A' : acc >= 70 ? 'B' : acc >= 50 ? 'C' : 'D';
  const song = SONGS[+songSel.value];
  const key = 'kd-best-' + song.name + '-' + $('speed').value + (g.usedWait ? '-wait' : '');
  let best = 0;
  try { best = +localStorage.getItem(key) || 0; if (g.score > best) localStorage.setItem(key, g.score); } catch (e) {}
  const newBest = g.score > best;
  stopGame();
  showOverlay(`
    <h2>${song.name}</h2>
    <div class="grade">${grade}</div>
    <p>分數 <b style="color:var(--text)">${g.score}</b>${newBest ? ' 🏆 新紀錄！' : `（最佳 ${best}）`}</p>
    <p>完美 ${g.perfect}　不錯 ${g.good}　失誤 ${g.miss}${g.usedWait ? `　按錯 ${g.wrong}` : ''}　最大連擊 ${g.maxCombo}</p>
    ${g.usedWait ? '<p>（等我按模式）</p>' : ''}
    <p>準確率 ${acc.toFixed(1)}%</p>
    <p style="margin-top:6px">按空白鍵再玩一次</p>`);
}

// ---------- Rendering ----------
function burst(lane, color, n) {
  const W = cv.clientWidth, laneW = W / 8;
  const x = laneW * (lane + 0.5), y = hitY();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, color });
  }
}
function hitY() { return cv.clientHeight - 50; }

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const PX_PER_SEC = 320;

function frame() {
  const W = cv.clientWidth, H = cv.clientHeight, laneW = W / 8, HY = hitY();
  const nowMs = performance.now();
  ctx.clearRect(0, 0, W, H);

  // lanes
  for (let i = 0; i < 8; i++) {
    const f = Math.max(0, 1 - (nowMs - flashes[i]) / 220);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(1, DRUMS[i].color + Math.round(20 + f * 90).toString(16).padStart(2, '0'));
    ctx.fillStyle = grad;
    ctx.fillRect(i * laneW, 0, laneW, H);
    ctx.fillStyle = '#ffffff10';
    ctx.fillRect(i * laneW, 0, 1, H);
  }

  if (game && game.running) {
    const now = songTime();
    scheduleMusic(now);
    // beat lines
    const beat = 60 / game.bpm;
    const firstBeat = Math.ceil((now - 0.3 - game.lead) / beat);
    for (let b = firstBeat; ; b++) {
      const t = game.lead + b * beat;
      const y = HY - (t - now) * PX_PER_SEC;
      if (y < 0) break;
      ctx.fillStyle = b % 4 === 0 ? '#ffffff26' : '#ffffff0d';
      ctx.fillRect(0, y, W, b % 4 === 0 ? 2 : 1);
    }
    // notes
    for (const n of game.notes) {
      if (n.state === 0 && !game.wait && now - n.t > WIN_GOOD) registerJudge(n, 'miss');
      if (n.state === 1) continue;
      const y = HY - (n.t - now) * PX_PER_SEC;
      if (y < -20) break;
      if (y > H + 20) continue;
      const x = n.lane * laneW;
      ctx.globalAlpha = n.state === 2 ? 0.25 : 1;
      ctx.fillStyle = DRUMS[n.lane].color;
      roundRect(x + 6, y - 9, laneW - 12, 18, 9);
      ctx.fillStyle = '#ffffff88';
      roundRect(x + 10, y - 6, laneW - 20, 4, 2);
      ctx.globalAlpha = 1;
    }
    // wait-mode hint: highlight the keys the song is waiting for
    const waitLanes = new Set();
    if (game.waiting) {
      for (let i = game.ptr; i < game.notes.length && game.notes[i].t <= now + 1e-6; i++)
        if (!game.notes[i].state) waitLanes.add(game.notes[i].lane);
      const label = [...waitLanes].map(l => DRUMS[l].label).join(' + ');
      ctx.font = 'bold 20px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffffdd';
      ctx.fillText('⏸ 等你按：' + label, W / 2, 30);
    }
    padEls.forEach((p, i) => p.classList.toggle('wait', waitLanes.has(i)));
    // progress bar
    ctx.fillStyle = '#6b4dff';
    ctx.fillRect(0, 0, W * Math.min(1, Math.max(0, now / game.end)), 3);
    if (now > game.end) finishGame();
  }

  // hit line
  ctx.fillStyle = '#ffffffcc';
  ctx.fillRect(0, HY - 1, W, 2);
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = DRUMS[i].color;
    ctx.fillText(DRUMS[i].label, (i + 0.5) * laneW, HY + 25);
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.03;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life + 1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
